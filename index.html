<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainee Feedback Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 18px 60px;
      background: #f5f7f6;
      color: #27343d;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: #ffffff;
      border: 1px solid #dfe5e2;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(30, 45, 55, 0.05);
    }

    .header h1 {
      margin: 0 0 7px;
      color: #243746;
      font-size: 26px;
    }

    .header p {
      margin: 0;
      color: #6b777e;
      font-size: 14px;
    }

    .input-section {
      background: #ffffff;
      border: 1px solid #dfe5e2;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(30, 45, 55, 0.05);
    }

    .input-section label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #334650;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 12px;
      border: 1px solid #cfd8d4;
      border-radius: 9px;
      resize: vertical;
      outline: none;
      font: inherit;
      color: #26343c;
      background: #fbfcfb;
    }

    textarea:focus,
    input:focus,
    select:focus {
      border-color: #7cae91;
      box-shadow: 0 0 0 3px rgba(124, 174, 145, 0.12);
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 12px;
    }

    button {
      border: 1px solid #cbd6d1;
      background: #ffffff;
      color: #30423c;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      transition: 0.15s ease;
    }

    button:hover {
      background: #f2f6f4;
    }

    button.primary {
      background: #5f8f73;
      border-color: #5f8f73;
      color: #ffffff;
    }

    button.primary:hover {
      background: #527f65;
    }

    button.danger {
      color: #9a4b4b;
      border-color: #dfc3c3;
    }

    .search-row {
      margin-top: 18px;
    }

    .search-row input {
      width: 100%;
      height: 42px;
      padding: 0 13px;
      border: 1px solid #cfd8d4;
      border-radius: 9px;
      outline: none;
      font: inherit;
      background: #fbfcfb;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .trainee-count {
      color: #66747a;
      font-size: 14px;
    }

    .trainee-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .trainee-card {
      background: #ffffff;
      border: 1px solid #dfe5e2;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(30, 45, 55, 0.04);
    }

    .trainee-header {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 10px 17px;
      background: #ffffff;
      border: 0;
      text-align: left;
      color: #263943;
    }

    .trainee-toggle {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
      border: 0;
      background: transparent;
      color: #263943;
      text-align: left;
      cursor: pointer;
    }

    .trainee-toggle:hover {
      background: transparent;
    }

    .trainee-arrow {
      width: 18px;
      font-size: 13px;
      color: #63736c;
      flex: 0 0 18px;
      text-align: center;
    }

    .trainee-name-title {
      font-size: 16px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
    }

    .remove-trainee-btn {
      flex: 0 0 auto;
      padding: 7px 11px;
      font-size: 12px;
      color: #9a4b4b;
      border: 1px solid #dfc3c3;
      background: #ffffff;
      border-radius: 7px;
      cursor: pointer;
    }

    .remove-trainee-btn:hover {
      background: #fff5f5;
      border-color: #d6aaaa;
    }

    .trainee-body {
      display: none;
      border-top: 1px solid #e3e9e6;
      padding: 18px;
    }

    .trainee-card.open .trainee-body {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .field {
      background: #fafcfa;
      border: 1px solid #e0e6e3;
      border-radius: 9px;
      padding: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 600;
      color: #65736e;
    }

    select,
    .number-input,
    .name-input {
      width: 100%;
      height: 38px;
      border: 1px solid #ccd6d2;
      border-radius: 7px;
      padding: 0 10px;
      outline: none;
      background: #ffffff;
      color: #28373e;
      font: inherit;
    }

    .name-field {
      grid-column: span 3;
    }

    .attendance-section {
      border: 1px solid #e0e6e3;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 18px;
      background: #fbfcfb;
    }

    .section-title {
      margin: 0 0 12px;
      color: #344840;
      font-size: 14px;
      font-weight: 700;
    }

    .attendance-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .attendance-item {
      border: 1px solid #e0e6e3;
      background: #ffffff;
      border-radius: 8px;
      padding: 9px 10px;
      transition: 0.15s ease;
    }

    .attendance-item.disabled {
      background: #f8faf9;
    }

    .attendance-top {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
    }

    .attendance-top input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
    }

    .attendance-top label {
      font-size: 13px;
      color: #3e4d52;
      cursor: pointer;
      margin: 0;
    }

    .attendance-controls {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 8px;
      align-items: center;
    }

    .number-input:disabled {
      background: #f1f4f2;
      color: #a0aaa5;
      border-color: #e0e5e2;
      cursor: not-allowed;
      opacity: 0.8;
    }

    .attendance-word {
      font-size: 12px;
      color: #68766f;
      min-height: 16px;
    }

    .camera-section {
      border: 1px solid #e0e6e3;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 18px;
      background: #fbfcfb;
    }

    .radio-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .radio-option {
      flex: 1;
      min-width: 150px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #e0e6e3;
      border-radius: 8px;
      background: #ffffff;
      padding: 10px;
      cursor: pointer;
      color: #3e4d52;
      font-size: 13px;
    }

    .radio-option input {
      margin: 0;
      cursor: pointer;
    }

    .radio-option.selected {
      border-color: #bcd3c3;
      background: #f5faf6;
    }

    .feedback-section {
      border-top: 1px solid #e4e9e6;
      padding-top: 18px;
    }

    .feedback-intro {
      margin: -4px 0 14px;
      color: #74807b;
      font-size: 12px;
      line-height: 1.5;
    }

    .question-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .feedback-question {
      border: 1px solid #dfe6e2;
      border-radius: 10px;
      background: #ffffff;
      padding: 13px;
    }

    .question-text {
      color: #354640;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 10px;
    }

    .answer-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .answer-btn {
      min-height: 38px;
      font-size: 12px;
      font-weight: 600;
      background: #ffffff;
    }

    .answer-btn.good {
      color: #4f795f;
      border-color: #c8dccf;
    }

    .answer-btn.good:hover {
      background: #f3f8f4;
    }

    .answer-btn.good.selected {
      background: #5f8f73;
      border-color: #5f8f73;
      color: #ffffff;
    }

    .answer-btn.bad {
      color: #996161;
      border-color: #dfcccc;
    }

    .answer-btn.bad:hover {
      background: #fff6f6;
    }

    .answer-btn.bad.selected {
      background: #a76666;
      border-color: #a76666;
      color: #ffffff;
    }

    .answer-state {
      margin-top: 7px;
      min-height: 15px;
      font-size: 11px;
      color: #78847f;
    }

    .follow-up {
      margin-top: 10px;
      padding: 11px;
      border-radius: 8px;
      background: #f8faf9;
      border: 1px solid #e3e9e5;
    }

    .follow-up-title {
      color: #586761;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .follow-up-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .follow-up-btn {
      min-height: 35px;
      font-size: 11px;
      font-weight: 600;
      background: #ffffff;
      color: #53625b;
      border-color: #d3ddd8;
    }

    .follow-up-btn:hover {
      background: #f4f7f5;
    }

    .follow-up-btn.selected {
      background: #e6eee9;
      border-color: #abc5b3;
      color: #365642;
    }

    .follow-up-btn.selected.bad-trend {
      background: #f2e5e5;
      border-color: #d8b4b4;
      color: #8a5555;
    }

    .case-type-section {
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px solid #e2e8e4;
    }

    .case-type-title {
      color: #586761;
      font-size: 12px;
      font-weight: 600;
      margin: 0 0 8px;
      line-height: 1.45;
    }

    .case-type-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .case-type-btn {
      min-height: 34px;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 700;
      background: #ffffff;
      color: #53625b;
      border-color: #d3ddd8;
    }

    .case-type-btn:hover {
      background: #f4f7f5;
    }

    .case-type-btn.selected {
      background: #e6eee9;
      border-color: #abc5b3;
      color: #365642;
    }

    .case-type-btn.selected.bad-case {
      background: #f2e5e5;
      border-color: #d8b4b4;
      color: #8a5555;
    }

    .custom-section {
      margin-top: 16px;
    }

    .custom-section label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #465650;
    }

    .custom-section textarea {
      min-height: 75px;
    }

    .preview-section {
      margin-top: 16px;
    }

    .preview-box {
      background: #f6f9f7;
      border: 1px solid #dbe5df;
      border-radius: 9px;
      padding: 13px;
      min-height: 70px;
      color: #33443d;
      font-size: 13px;
      line-height: 1.65;
      white-space: normal;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .empty {
      background: #ffffff;
      border: 1px dashed #ccd7d2;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      color: #78847f;
      font-size: 14px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #30443a;
      color: #ffffff;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 800px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .name-field {
        grid-column: span 1;
      }

      .attendance-grid {
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }

      .attendance-item {
        padding: 8px;
      }

      .attendance-controls {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .attendance-word {
        font-size: 10px;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 520px) {

      body {
        padding: 15px 10px 40px;
      }

      .header,
      .input-section {
        padding: 15px;
      }

      .trainee-header {
        padding: 9px 9px 9px 12px;
      }

      .trainee-body {
        padding: 12px;
      }

      .attendance-grid {
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }

      .attendance-item {
        padding: 8px 7px;
      }

      .attendance-top {
        gap: 5px;
      }

      .attendance-top label {
        font-size: 12px;
      }

      .attendance-controls {
        grid-template-columns: 58px 1fr;
        gap: 5px;
      }

      .attendance-word {
        font-size: 9px;
        line-height: 1.2;
      }

      .number-input {
        height: 34px;
        font-size: 12px;
        padding: 0 7px;
      }

      .remove-trainee-btn {
        padding: 7px 8px;
        font-size: 11px;
      }

      .trainee-name-title {
        font-size: 15px;
      }

      .answer-buttons {
        grid-template-columns: 1fr 1fr;
      }

      .follow-up-buttons {
        grid-template-columns: 1fr;
      }

      .case-type-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .radio-option {
        min-width: 0;
        padding: 9px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>Trainee Feedback Builder</h1>

    <p>
      Create individualized training feedback quickly and consistently.
    </p>
  </div>


  <div class="input-section">

    <label for="traineeNames">
      Trainee Names — one name per line
    </label>

    <textarea
      id="traineeNames"
      placeholder="Ahmed&#10;Mohamed&#10;Sara&#10;Omar"
    ></textarea>

    <div class="top-actions">

      <button
        class="primary"
        onclick="addTrainees()"
        type="button"
      >
        Add Trainees
      </button>

      <button
        onclick="copyAllFeedback()"
        type="button"
      >
        Copy All Feedback
      </button>

      <button
        class="danger"
        onclick="clearAll()"
        type="button"
      >
        Clear All
      </button>

    </div>

    <div class="search-row">

      <input
        id="globalSearch"
        type="text"
        placeholder="Search trainees..."
        oninput="render()"
      >

    </div>

  </div>


  <div class="toolbar">

    <div
      class="trainee-count"
      id="traineeCount"
    >
      0 trainees
    </div>

  </div>


  <div
    id="traineeList"
    class="trainee-list"
  ></div>

</div>


<div
  id="toast"
  class="toast"
></div>

const STORAGE_KEY =
  "trainee_feedback_builder_v9";

const RANDOM_HISTORY_KEY =
  "trainee_feedback_random_history_v3";

let trainees = [];

let randomHistory = {};


function createId() {

  return (
    "t_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 9)
  );

}


function findTrainee(id) {

  return trainees.find(
    function(trainee) {
      return trainee.id === id;
    }
  );

}


function findQuestion(key) {

  return feedbackQuestions.find(
    function(question) {
      return question.key === key;
    }
  ) || null;

}


function loadRandomHistory() {

  try {

    const saved =
      localStorage.getItem(
        RANDOM_HISTORY_KEY
      );

    if (!saved) {

      randomHistory = {};

      return;

    }

    const parsed =
      JSON.parse(saved);

    randomHistory =
      parsed &&
      typeof parsed === "object"
        ? parsed
        : {};

  } catch (error) {

    randomHistory = {};

  }

}


function saveRandomHistory() {

  try {

    localStorage.setItem(
      RANDOM_HISTORY_KEY,
      JSON.stringify(
        randomHistory
      )
    );

  } catch (error) {

    console.error(
      "Could not save random history:",
      error
    );

  }

}


function getRandomFromPool(
  historyKey,
  comments,
  previousComment
) {

  if (
    !Array.isArray(comments) ||
    !comments.length
  ) {

    return "";

  }


  if (
    !randomHistory[historyKey] ||
    !Array.isArray(
      randomHistory[historyKey]
    )
  ) {

    randomHistory[historyKey] = [];

  }


  let history =
    randomHistory[historyKey];


  history =
    history.filter(
      function(index) {

        return (
          Number.isInteger(index) &&
          index >= 0 &&
          index < comments.length
        );

      }
    );


  if (
    history.length >= comments.length
  ) {

    history = [];

  }


  let available =
    comments
      .map(
        function(_, index) {
          return index;
        }
      )
      .filter(
        function(index) {

          return !history.includes(
            index
          );

        }
      );


  if (
    previousComment &&
    available.length > 1
  ) {

    const filtered =
      available.filter(
        function(index) {

          return (
            comments[index] !==
            previousComment
          );

        }
      );

    if (filtered.length) {

      available =
        filtered;

    }

  }


  if (!available.length) {

    available =
      comments.map(
        function(_, index) {
          return index;
        }
      );

  }


  const randomIndex =
    available[
      Math.floor(
        Math.random() *
        available.length
      )
    ];


  history.push(
    randomIndex
  );


  randomHistory[historyKey] =
    history;


  saveRandomHistory();


  return comments[
    randomIndex
  ];

}


function shuffleArray(array) {

  const shuffled =
    [...array];


  for (
    let i = shuffled.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      shuffled[i],
      shuffled[j]
    ] = [
      shuffled[j],
      shuffled[i]
    ];

  }


  return shuffled;

}


function getRandomComment(
  questionKey,
  type,
  previousComment
) {

  const question =
    findQuestion(
      questionKey
    );


  if (!question) {
    return "";
  }


  const comments =
    type === "good"
      ? question.good
      : question.bad;


  return getRandomFromPool(
    questionKey + "_" + type,
    comments,
    previousComment
  );

}


function getRandomPerformanceComment(
  understandingAnswer,
  progress,
  previousComment
) {

  if (progress === "select_cases") {
    return "";
  }


  const question =
    findQuestion(
      "understanding"
    );


  if (
    !question ||
    !question.performance
  ) {

    return "";

  }


  const side =
    understandingAnswer === "good"
      ? question.performance.good
      : question.performance.bad;


  if (
    !side ||
    !Array.isArray(
      side[progress]
    )
  ) {

    return "";

  }


  const historyKey =
    "understanding_performance_" +
    understandingAnswer +
    "_" +
    progress;


  return getRandomFromPool(
    historyKey,
    side[progress],
    previousComment
  );

}

function addTrainees() {

  const textarea =
    document.getElementById(
      "traineeNames"
    );


  const names =
    textarea.value
      .split("\n")
      .map(
        function(name) {
          return name.trim();
        }
      )
      .filter(
        function(name) {
          return name.length > 0;
        }
      );


  if (!names.length) {

    showToast(
      "Please enter at least one trainee name."
    );

    return;

  }


  names.forEach(
    function(name) {

      trainees.push(
        createTrainee(name)
      );

    }
  );


  textarea.value = "";

  saveData();

  render();


  showToast(
    names.length +
    " trainee(s) added."
  );

}


function render() {

  const list =
    document.getElementById(
      "traineeList"
    );


  const count =
    document.getElementById(
      "traineeCount"
    );


  const search =
    document
      .getElementById(
        "globalSearch"
      )
      .value
      .toLowerCase()
      .trim();


  const filtered =
    trainees.filter(
      function(trainee) {

        if (!search) {
          return true;
        }

        return trainee.name
          .toLowerCase()
          .includes(search);

      }
    );


  count.textContent =
    trainees.length +
    (
      trainees.length === 1
        ? " trainee"
        : " trainees"
    );


  if (!filtered.length) {

    list.innerHTML = `

      <div class="empty">

        ${
          trainees.length
            ? "No trainees match your search."
            : "No trainees added yet."
        }

      </div>

    `;

    return;

  }


  list.innerHTML =
    filtered
      .map(
        function(trainee, index) {

          return createTraineeHTML(
            trainee,
            index
          );

        }
      )
      .join("");

}

function renderFeedbackQuestions(
  trainee
) {

  return feedbackQuestions
    .map(
      function(question) {

        const answer =
          trainee.answers &&
          trainee.answers[
            question.key
          ]
            ? trainee.answers[
                question.key
              ]
            : "";


        let stateText = "";


        if (answer === "good") {

          stateText =
            "Good selected";

        } else if (answer === "bad") {

          stateText =
            "Needs improvement selected";

        }


        let followUpHTML = "";


        if (
          question.key === "understanding" &&
          answer
        ) {

          const progress =
            trainee.understandingProgress ||
            "";


          const firstLabel =
            answer === "good"
              ? "Good Performance"
              : "Bad Performance";


          const secondLabel =
            answer === "good"
              ? "Started weak and improved"
              : "Started good and declined";


          const firstValue =
            answer === "good"
              ? "good_performance"
              : "bad_performance";


          const secondValue =
            answer === "good"
              ? "improved"
              : "declined";


          const caseTypeTitle =
            answer === "good"
              ? "What was the trainee good at? — In which case type did the trainee perform well?"
              : "What did the trainee need improvement in? — Which case type did the trainee struggle with?";


          let caseTypeHTML = "";


          /*
            Case Type appears ONLY when
            Select Cases is selected.
          */

          if (
            progress === "select_cases"
          ) {

            caseTypeHTML = `

              <div class="case-type-section">

                <div class="case-type-title">
                  ${escapeHTML(
                    caseTypeTitle
                  )}
                </div>

                <div class="case-type-grid">

                  ${Object.keys(caseTypeLabels)
                    .map(
                      function(key) {

                        return `

                          <button
                            type="button"
                            class="case-type-btn ${
                              trainee.caseType === key
                                ? "selected" +
                                  (
                                    answer === "bad"
                                      ? " bad-case"
                                      : ""
                                  )
                                : ""
                            }"
                            onclick="setCaseType(
                              '${trainee.id}',
                              '${key}'
                            )"
                          >
                            ${escapeHTML(
                              key
                            )}
                          </button>

                        `;

                      }
                    )
                    .join("")}

                </div>

              </div>

            `;

          }


          followUpHTML = `

            <div class="follow-up">

              <div class="follow-up-title">
                How was the trainee's performance throughout the training? — كيف كان أداء المتدرب طوال فترة التدريب؟
              </div>


              <div class="follow-up-buttons">

                <button
                  type="button"
                  class="follow-up-btn ${
                    progress === firstValue
                      ? "selected" +
                        (
                          answer === "bad"
                            ? " bad-trend"
                            : ""
                        )
                      : ""
                  }"
                  onclick="setUnderstandingProgress(
                    '${trainee.id}',
                    '${firstValue}'
                  )"
                >
                  ${escapeHTML(
                    firstLabel
                  )}
                </button>


                <button
                  type="button"
                  class="follow-up-btn ${
                    progress === "select_cases"
                      ? "selected" +
                        (
                          answer === "bad"
                            ? " bad-trend"
                            : ""
                        )
                      : ""
                  }"
                  onclick="setUnderstandingProgress(
                    '${trainee.id}',
                    'select_cases'
                  )"
                >
                  Select Cases
                </button>


                <button
                  type="button"
                  class="follow-up-btn ${
                    progress === secondValue
                      ? "selected" +
                        (
                          answer === "bad"
                            ? " bad-trend"
                            : ""
                        )
                      : ""
                  }"
                  onclick="setUnderstandingProgress(
                    '${trainee.id}',
                    '${secondValue}'
                  )"
                >
                  ${escapeHTML(
                    secondLabel
                  )}
                </button>

              </div>


              ${caseTypeHTML}

            </div>

          `;

        }


        return `

          <div class="feedback-question">

            <div class="question-text">

              ${escapeHTML(
                question.question
              )}

            </div>


            <div class="answer-buttons">

              <button
                type="button"
                class="answer-btn good ${
                  answer === "good"
                    ? "selected"
                    : ""
                }"
                onclick="setFeedbackAnswer(
                  '${trainee.id}',
                  '${question.key}',
                  'good'
                )"
              >
                Good
              </button>


              <button
                type="button"
                class="answer-btn bad ${
                  answer === "bad"
                    ? "selected"
                    : ""
                }"
                onclick="setFeedbackAnswer(
                  '${trainee.id}',
                  '${question.key}',
                  'bad'
                )"
              >
                Needs Improvement
              </button>

            </div>


            <div class="answer-state">

              ${escapeHTML(
                stateText
              )}

            </div>


            ${followUpHTML}

          </div>

        `;

      }
    )
    .join("");

}


function setCamera(
  id,
  value
) {

  const trainee =
    findTrainee(id);

  if (!trainee) {
    return;
  }

  trainee.camera =
    value;

  delete trainee.randomComments.camera;

  saveData();

  renderCardBody(id);

  updatePreview(id);

}


function setCaseType(
  id,
  value
) {

  const trainee =
    findTrainee(id);

  if (!trainee) {
    return;
  }


  const understanding =
    trainee.answers &&
    trainee.answers.understanding;


  if (
    understanding !== "good" &&
    understanding !== "bad"
  ) {

    return;

  }


  if (
    trainee.understandingProgress !==
    "select_cases"
  ) {

    return;

  }


  trainee.caseType =
    Object.prototype.hasOwnProperty.call(
      caseTypeComments,
      value
    )
      ? value
      : "";


  if (!trainee.randomComments) {

    trainee.randomComments = {};

  }


  delete trainee.randomComments.caseType;


  if (trainee.caseType) {

    const pool =
      caseTypeComments[
        trainee.caseType
      ][
        understanding
      ];


    trainee.randomComments.caseType =
      getRandomFromPool(
        "caseType_" +
        trainee.caseType +
        "_" +
        understanding,
        pool,
        null
      );

  }


  saveData();

  updateFeedbackUI(id);

  updatePreview(id);

}


function setFeedbackAnswer(
  id,
  questionKey,
  answer
) {

  const trainee =
    findTrainee(id);


  if (!trainee) {
    return;
  }


  if (!trainee.answers) {

    trainee.answers = {};

  }


  if (!trainee.randomComments) {

    trainee.randomComments = {};

  }


  const previousAnswer =
    trainee.answers[
      questionKey
    ];


  if (
    previousAnswer === answer
  ) {

    delete trainee.answers[
      questionKey
    ];


    delete trainee.randomComments[
      questionKey
    ];


    if (
      questionKey === "understanding"
    ) {

      trainee.understandingProgress =
        "";

      trainee.caseType =
        "";


      delete trainee.randomComments[
        "understandingProgress"
      ];


      delete trainee.randomComments[
        "caseType"
      ];

    }

  } else {

    trainee.answers[
      questionKey
    ] = answer;


    trainee.randomComments[
      questionKey
    ] =
      getRandomComment(
        questionKey,
        answer,
        trainee.randomComments[
          questionKey
        ]
      );


    if (
      questionKey === "understanding"
    ) {

      trainee.understandingProgress =
        "";

      trainee.caseType =
        "";


      delete trainee.randomComments[
        "understandingProgress"
      ];


      delete trainee.randomComments[
        "caseType"
      ];

    }

  }


  saveData();

  updateFeedbackUI(id);

  updatePreview(id);

}


function setUnderstandingProgress(
  id,
  value
) {

  const trainee =
    findTrainee(id);


  if (!trainee) {
    return;
  }


  const understanding =
    trainee.answers &&
    trainee.answers.understanding;


  if (
    understanding !== "good" &&
    understanding !== "bad"
  ) {

    return;

  }


  const validValues = [
    "good_performance",
    "select_cases",
    "improved",
    "bad_performance",
    "declined"
  ];


  if (
    !validValues.includes(value)
  ) {

    return;

  }


  const previous =
    trainee.understandingProgress;


  if (
    previous === value
  ) {

    trainee.understandingProgress =
      "";


    trainee.caseType =
      "";


    if (
      trainee.randomComments
    ) {

      delete trainee.randomComments[
        "understandingProgress"
      ];

      delete trainee.randomComments[
        "caseType"
      ];

    }

  } else {

    trainee.understandingProgress =
      value;


    /*
      Case Type is only relevant when
      Select Cases is selected.
    */

    trainee.caseType =
      "";


    if (!trainee.randomComments) {

      trainee.randomComments = {};

    }


    delete trainee.randomComments.caseType;


    if (value === "select_cases") {

      delete trainee.randomComments[
        "understandingProgress"
      ];

    } else {

      trainee.randomComments[
        "understandingProgress"
      ] =
        getRandomPerformanceComment(
          understanding,
          value,
          trainee.randomComments[
            "understandingProgress"
          ]
        );

    }

  }


  saveData();

  updateFeedbackUI(id);

  updatePreview(id);

}

function generateFeedback(
  trainee
) {

  if (!trainee) {
    return "";
  }


  const hasActualFeedback =
    (
      trainee.answers &&
      Object.keys(
        trainee.answers
      ).length > 0
    ) ||
    trainee.custom.trim() !== "" ||
    trainee.tardyEnabled ||
    trainee.absentEnabled ||
    trainee.camera !== "" ||
    trainee.caseType !== "";


  if (!hasActualFeedback) {
    return "";
  }


  const pronoun =
    trainee.gender === "She"
      ? "She"
      : "He";


  const feedbackParts = [];


  if (
    trainee.finalQuiz === "Passed"
  ) {

    feedbackParts.push(
      "passed the final quiz successfully"
    );

  } else {

    feedbackParts.push(
      "did not pass the final quiz"
    );

  }


  if (
    trainee.dailyQuiz ===
    "Completed all daily quizzes successfully"
  ) {

    feedbackParts.push(
      "completed all daily quizzes successfully"
    );

  } else {

    feedbackParts.push(
      "missed daily quizzes, coaching was provided"
    );

  }


  if (trainee.camera) {

    const cameraType =
      trainee.camera === "always"
        ? "good"
        : "bad";


    if (!trainee.randomComments) {

      trainee.randomComments = {};

    }


    let cameraComment =
      trainee.randomComments.camera;


    if (!cameraComment) {

      cameraComment =
        getRandomFromPool(
          `camera_${cameraType}`,
          cameraComments[cameraType],
          null
        );


      trainee.randomComments.camera =
        cameraComment;

    }


    if (
      cameraComment &&
      cameraComment.trim()
    ) {

      feedbackParts.push(
        cameraComment.trim()
      );

    }

  }


  if (
    trainee.answers &&
    typeof trainee.answers === "object"
  ) {

    feedbackQuestions.forEach(
      function(question) {

        const answer =
          trainee.answers[
            question.key
          ];


        if (
          answer !== "good" &&
          answer !== "bad"
        ) {

          return;

        }


        let comment = "";


        if (
          trainee.randomComments &&
          trainee.randomComments[
            question.key
          ]
        ) {

          comment =
            trainee.randomComments[
              question.key
            ];

        }


        if (!comment) {

          comment =
            getRandomComment(
              question.key,
              answer
            );


          if (!trainee.randomComments) {

            trainee.randomComments = {};

          }


          trainee.randomComments[
            question.key
          ] =
            comment;

        }


        if (
          comment &&
          comment.trim()
        ) {

          feedbackParts.push(
            comment.trim()
          );

        }


        if (
          question.key === "understanding" &&
          trainee.understandingProgress &&
          trainee.understandingProgress !==
          "select_cases"
        ) {

          const progressComment =
            trainee.randomComments &&
            trainee.randomComments[
              "understandingProgress"
            ]
              ? trainee.randomComments[
                  "understandingProgress"
                ]
              : "";


          if (
            progressComment &&
            progressComment.trim()
          ) {

            feedbackParts.push(
              progressComment.trim()
            );

          }

        }


        if (
          question.key === "understanding" &&
          (answer === "good" || answer === "bad") &&
          trainee.understandingProgress ===
          "select_cases" &&
          trainee.caseType
        ) {

          let caseComment =
            trainee.randomComments &&
            trainee.randomComments.caseType
              ? trainee.randomComments.caseType
              : "";


          if (!caseComment) {

            const pool =
              caseTypeComments[
                trainee.caseType
              ] &&
              caseTypeComments[
                trainee.caseType
              ][
                answer
              ];


            if (pool && pool.length) {

              caseComment =
                getRandomFromPool(
                  "caseType_" +
                  trainee.caseType +
                  "_" +
                  answer,
                  pool,
                  null
                );


              if (!trainee.randomComments) {

                trainee.randomComments = {};

              }


              trainee.randomComments.caseType =
                caseComment;

            }

          }


          if (
            caseComment &&
            caseComment.trim()
          ) {

            feedbackParts.push(
              caseComment.trim()
            );

          }

        }

      }
    );

  }


  const attendance =
    buildAttendanceComment(
      trainee
    );


  if (attendance) {

    feedbackParts.push(
      attendance
    );

  }


  const shuffledParts =
    shuffleArray(
      feedbackParts
    );


  if (
    trainee.custom &&
    trainee.custom.trim()
  ) {

    shuffledParts.push(
      trainee.custom.trim()
    );

  }


  if (!shuffledParts.length) {
    return "";
  }


  let result =
    pronoun +
    " " +
    shuffledParts
      .filter(
        function(part) {

          return String(part)
            .trim() !== "";

        }
      )
      .join(", ");


  result =
    result.trim();


  result =
    result.replace(
      /[.!?]+$/,
      ""
    );


  if (result) {

    result += ".";

  }


  return result;

}


function buildAttendanceComment(
  trainee
) {

  const tardy =
    trainee.tardyEnabled
      ? numberToWords(
          normalizeCount(
            trainee.tardyCount
          )
        )
      : null;


  const absent =
    trainee.absentEnabled
      ? numberToWords(
          normalizeCount(
            trainee.absentCount
          )
        )
      : null;


  if (!tardy && !absent) {
    return "";
  }


  if (tardy && absent) {

    return (
      "showed lack of commitment due to " +
      tardy +
      " tardy and " +
      absent +
      " absent"
    );

  }


  if (tardy) {

    return (
      "showed lack of commitment due to " +
      tardy +
      " tardy"
    );

  }


  if (absent) {

    return (
      "showed lack of commitment due to " +
      absent +
      " absent"
    );

  }


  return "";

}


function normalizeCount(
  value
) {

  let number =
    parseInt(
      value,
      10
    );


  if (
    isNaN(number) ||
    number < 1
  ) {

    number = 1;

  }


  if (number > 999) {

    number = 999;

  }


  return number;

}


function numberToWords(
  number
) {

  number =
    normalizeCount(
      number
    );


  const ones = [

    "",

    "one",

    "two",

    "three",

    "four",

    "five",

    "six",

    "seven",

    "eight",

    "nine",

    "ten",

    "eleven",

    "twelve",

    "thirteen",

    "fourteen",

    "fifteen",

    "sixteen",

    "seventeen",

    "eighteen",

    "nineteen"

  ];


  const tens = [

    "",

    "",

    "twenty",

    "thirty",

    "forty",

    "fifty",

    "sixty",

    "seventy",

    "eighty",

    "ninety"

  ];


  if (
    number < 20
  ) {

    return ones[number];

  }


  if (
    number < 100
  ) {

    if (
      number % 10 === 0
    ) {

      return tens[
        Math.floor(
          number / 10
        )
      ];

    }


    return (
      tens[
        Math.floor(
          number / 10
        )
      ] +
      "-" +
      ones[
        number % 10
      ]
    );

  }


  if (
    number < 1000
  ) {

    const hundred =
      Math.floor(
        number / 100
      );


    const remainder =
      number % 100;


    if (
      remainder === 0
    ) {

      return (
        ones[hundred] +
        " hundred"
      );

    }


    return (
      ones[hundred] +
      " hundred " +
      numberToWords(
        remainder
      )
    );

  }


  return String(number);

}


function updatePreview(
  id
) {

  const trainee =
    findTrainee(id);


  if (!trainee) {
    return;
  }


  const preview =
    document.getElementById(
      "preview-" + id
    );


  if (preview) {

    preview.textContent =
      generateFeedback(
        trainee
      );

  }


  saveData();

}


function updateAllPreviews() {

  trainees.forEach(
    function(trainee) {

      updatePreview(
        trainee.id
      );

    }
  );

}


function copyFeedback(
  id
) {

  const trainee =
    findTrainee(id);


  if (!trainee) {
    return;
  }


  const text =
    generateFeedback(
      trainee
    );


  if (!text.trim()) {

    showToast(
      "There is no feedback to copy."
    );

    return;

  }


  copyText(
    text
  );

}


function copyAllFeedback() {

  if (!trainees.length) {

    showToast(
      "No trainees available."
    );

    return;

  }


  const blocks =
    trainees
      .map(
        function(trainee) {

          const feedback =
            generateFeedback(
              trainee
            );


          if (!feedback.trim()) {
            return "";
          }


          return (
            trainee.name.trim() +
            ":\n" +
            feedback
          );

        }
      )
      .filter(
        function(block) {

          return block !== "";

        }
      );


  if (!blocks.length) {

    showToast(
      "There is no feedback to copy."
    );

    return;

  }


  copyText(
    blocks.join(
      "\n\n"
    )
  );

}


function copyText(
  text
) {

  if (
    navigator.clipboard &&
    navigator.clipboard.writeText
  ) {

    navigator.clipboard
      .writeText(
        text
      )
      .then(
        function() {

          showToast(
            "Copied successfully."
          );

        }
      )
      .catch(
        function() {

          fallbackCopy(
            text
          );

        }
      );

    return;

  }


  fallbackCopy(
    text
  );

}


function fallbackCopy(
  text
) {

  const textarea =
    document.createElement(
      "textarea"
    );


  textarea.value =
    text;


  textarea.style.position =
    "fixed";


  textarea.style.left =
    "-9999px";


  document.body.appendChild(
    textarea
  );


  textarea.select();


  try {

    document.execCommand(
      "copy"
    );


    showToast(
      "Copied successfully."
    );

  } catch (error) {

    showToast(
      "Copy failed. Please copy manually."
    );

  }


  document.body.removeChild(
    textarea
  );

}


function clearTrainee(
  id
) {

  const trainee =
    findTrainee(id);


  if (!trainee) {
    return;
  }


  const keepName =
    trainee.name;


  const keepOpen =
    trainee.open;


  const index =
    trainees.indexOf(
      trainee
    );


  trainees[index] =
    createTrainee(
      keepName
    );


  trainees[index].open =
    keepOpen;


  saveData();

  render();


  showToast(
    "Trainee feedback cleared."
  );

}


function removeTrainee(
  id
) {

  trainees =
    trainees.filter(
      function(trainee) {

        return trainee.id !== id;

      }
    );


  saveData();

  render();


  showToast(
    "Trainee removed."
  );

}


function clearAll() {

  if (!trainees.length) {
    return;
  }


  const confirmed =
    confirm(
      "Are you sure you want to remove all trainees?"
    );


  if (!confirmed) {
    return;
  }


  trainees = [];


  saveData();

  render();


  showToast(
    "All trainees removed."
  );

}


function saveData() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(
        trainees
      )
    );

  } catch (error) {

    console.error(
      "Could not save data:",
      error
    );

  }

}


function loadData() {

  try {

    let saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (!saved) {

      saved =
        localStorage.getItem(
          "trainee_feedback_builder_v8"
        );

    }


    if (!saved) {

      saved =
        localStorage.getItem(
          "trainee_feedback_builder_v7"
        );

    }


    if (!saved) {

      saved =
        localStorage.getItem(
          "trainee_feedback_builder_v6"
        );

    }


    if (!saved) {

      saved =
        localStorage.getItem(
          "trainee_feedback_builder_v5"
        );

    }


    if (!saved) {

      trainees = [];

      return;

    }


    const parsed =
      JSON.parse(
        saved
      );


    if (!Array.isArray(parsed)) {

      trainees = [];

      return;

    }


    trainees =
      parsed.map(
        function(trainee) {

          const answers = {};


          if (
            trainee.answers &&
            typeof trainee.answers ===
            "object"
          ) {

            feedbackQuestions.forEach(
              function(question) {

                const answer =
                  trainee.answers[
                    question.key
                  ];


                if (
                  answer === "good" ||
                  answer === "bad"
                ) {

                  answers[
                    question.key
                  ] = answer;

                }

              }
            );

          }


          const randomComments = {};


          if (
            trainee.camera &&
            trainee.randomComments &&
            trainee.randomComments.camera
          ) {

            randomComments.camera =
              trainee.randomComments.camera;

          }


          const savedCaseType =
            Object.prototype.hasOwnProperty.call(
              caseTypeComments,
              trainee.caseType
            )
              ? trainee.caseType
              : "";


          if (
            savedCaseType &&
            trainee.randomComments &&
            trainee.randomComments.caseType
          ) {

            randomComments.caseType =
              trainee.randomComments.caseType;

          }


          feedbackQuestions.forEach(
            function(question) {

              if (
                answers[
                  question.key
                ] &&
                trainee.randomComments &&
                trainee.randomComments[
                  question.key
                ]
              ) {

                randomComments[
                  question.key
                ] =
                  trainee.randomComments[
                    question.key
                  ];

              }

            }
          );


          let understandingProgress =
            trainee.understandingProgress ||
            "";


          if (
            understandingProgress !==
            "good_performance" &&
            understandingProgress !==
            "select_cases" &&
            understandingProgress !==
            "improved" &&
            understandingProgress !==
            "bad_performance" &&
            understandingProgress !==
            "declined"
          ) {

            understandingProgress =
              "";

          }


          if (
            !answers.understanding
          ) {

            understandingProgress =
              "";

          }


          if (
            answers.understanding === "good" &&
            (
              understandingProgress ===
              "bad_performance" ||
              understandingProgress ===
              "declined"
            )
          ) {

            understandingProgress =
              "";

          }


          if (
            answers.understanding === "bad" &&
            (
              understandingProgress ===
              "good_performance" ||
              understandingProgress ===
              "improved"
            )
          ) {

            understandingProgress =
              "";

          }


          let loadedCaseType =
            savedCaseType;


          /*
            Case Type is valid only when
            Select Cases is selected.
          */

          if (
            understandingProgress !==
            "select_cases"
          ) {

            loadedCaseType =
              "";

          }


          if (
            understandingProgress &&
            understandingProgress !==
            "select_cases" &&
            trainee.randomComments &&
            trainee.randomComments[
              "understandingProgress"
            ]
          ) {

            randomComments[
              "understandingProgress"
            ] =
              trainee.randomComments[
                "understandingProgress"
              ];

          }


          return {

            id:
              trainee.id ||
              createId(),

            name:
              trainee.name ||
              "",

            gender:
              trainee.gender === "She"
                ? "She"
                : "He",

            finalQuiz:
              trainee.finalQuiz ===
              "Did not pass"
                ? "Did not pass"
                : "Passed",

            dailyQuiz:
              trainee.dailyQuiz ===
              "missed daily quizzes, coaching was provided"
                ? "missed daily quizzes, coaching was provided"
                : "Completed all daily quizzes successfully",

            tardyEnabled:
              Boolean(
                trainee.tardyEnabled
              ),

            tardyCount:
              normalizeCount(
                trainee.tardyCount ||
                1
              ),

            absentEnabled:
              Boolean(
                trainee.absentEnabled
              ),

            absentCount:
              normalizeCount(
                trainee.absentCount ||
                1
              ),

            camera:
              trainee.camera === "always" ||
              trainee.camera === "sometimes_off"
                ? trainee.camera
                : "",

            caseType:
              loadedCaseType,

            answers:
              answers,

            randomComments:
              randomComments,

            understandingProgress:
              understandingProgress,

            custom:
              trainee.custom ||
              "",

            open:
              false

          };

        }
      );


    saveData();

  } catch (error) {

    console.error(
      "Could not load saved data:",
      error
    );


    trainees = [];

  }

}


function escapeHTML(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return escapeHTML(
    value
  );

}


let toastTimer =
  null;


function showToast(
  message
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function() {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


loadRandomHistory();

loadData();

render();

</script>
